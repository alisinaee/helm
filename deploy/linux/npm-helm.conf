# ------------------------------------------------------------
# helm.mjplabs.ir — Helm dashboard (~/StudioProjects/helm, systemd --user helm.service
# on 192.168.31.50:8780). Hand-written like studio above. Behind Authelia (one_factor).
# ------------------------------------------------------------
server {
  listen 80;
  listen 443 ssl;
  server_name helm.mjplabs.ir;
  http2 on;

  include conf.d/include/letsencrypt-acme-challenge.conf;
  include conf.d/include/ssl-cache.conf;
  include conf.d/include/ssl-ciphers.conf;
  ssl_certificate /etc/letsencrypt/live/npm-1/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/npm-1/privkey.pem;

  include conf.d/include/block-exploits.conf;
  set $trust_forwarded_proto "F";
  include conf.d/include/force-ssl.conf;

  access_log /data/logs/helm_access.log proxy;
  error_log /data/logs/helm_error.log warn;

  location /internal-authelia {
    internal;
    auth_request off;
    proxy_pass http://authelia:9091/api/authz/auth-request;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header X-Original-Method $request_method;
    proxy_set_header X-Original-URL $scheme://$http_host$request_uri;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Host $http_host;
  }

  location / {
    auth_request /internal-authelia;
    auth_request_set $redirect $upstream_http_location;
    auth_request_set $user $upstream_http_remote_user;
    error_page 401 =302 $redirect;

    add_header Strict-Transport-Security "max-age=63072000" always;
    proxy_pass http://192.168.31.50:8780;
    proxy_set_header Host $host;
    proxy_set_header Remote-User $user;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_set_header Connection '';
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }
}
