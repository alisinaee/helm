<body>
<a class="skip-link" href="#main">Skip to content</a>
<div id="app" class="app" data-nav="full" data-panel="open">
  <nav id="nav" class="nav" aria-label="Sections"></nav>
  <header id="topbar" class="top"></header>
  <main id="main" class="main" tabindex="-1"></main>
  <aside id="side" class="side" aria-label="Projects and details">
    <div class="side-tabs" role="tablist" aria-label="Panel">
      <button type="button" role="tab" id="tab-projects" aria-selected="true">Projects</button>
      <button type="button" role="tab" id="tab-details" aria-selected="false">Details</button>
    </div>
    <div class="side-body" role="tabpanel" aria-labelledby="tab-projects">
      <p class="placeholder">Coming soon</p>
    </div>
  </aside>
  <nav id="bnav" class="bnav" aria-label="Sections, small screens"></nav>
</div>
<div id="scrim" class="scrim" data-action="panel-close" hidden></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<div id="live-status" class="sr-only" aria-live="polite"></div>
<dialog id="help" class="help" aria-labelledby="help-title">
  <div class="help-head">
    <h2 id="help-title" class="help-title">Keyboard shortcuts</h2>
    <button type="button" class="btn" data-action="help-close">Close</button>
  </div>
  <div id="help-body"></div>
</dialog>
<noscript><p class="banner banner-danger">Helm needs JavaScript to show the dashboard.</p></noscript>
<script type="module" src="/js/app.js"></script>
</body>
